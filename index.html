<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vade-Mecum Maths DNB</title>
    <style>
        :root {
            --bleu: #1e3c72;
            --bleu-clair: #667eea;
            --vert: #28a745;
            --rouge: #dc3545;
            --orange: #fd7e14;
            --jaune: #ffc107;
            --gris: #f8f9fa;
            --blanc: #ffffff;
            --bordure: #dee2e6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--blanc);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #0d1b3e 0%, #1e3c72 50%, #2a5298 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            background: var(--blanc);
            border-radius: 50%;
        }
        header h1 { font-size: 2em; margin-bottom: 5px; position: relative; z-index: 1; }
        header .subtitle { font-size: 1.1em; opacity: 0.9; position: relative; z-index: 1; }
        .code-section {
            background: #f0f4ff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid var(--bleu-clair);
        }
        .code-section h3 { color: var(--bleu); margin-bottom: 15px; font-size: 1.2em; }
        .code-input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .code-section input {
            padding: 15px 20px;
            font-size: 1.3em;
            border: 3px solid #ccc;
            border-radius: 12px;
            text-align: center;
            letter-spacing: 1px;
            width: 220px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .code-section input:focus {
            outline: none;
            border-color: var(--bleu-clair);
            box-shadow: 0 0 20px rgba(102,126,234,0.3);
        }
        .btn-access {
            padding: 15px 40px;
            font-size: 1.2em;
            background: var(--vert);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-access:hover { background: #1e7e34; transform: scale(1.05); }
        .error-message { color: var(--rouge); margin-top: 15px; font-weight: bold; display: none; }
        .content { display: none; padding: 20px 25px; }
        .content.active { display: block; }
        .user-bar {
            background: #e8f0fe;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .user-bar .user-name { font-weight: bold; color: var(--bleu); font-size: 1.1em; }
        .btn-send {
            padding: 10px 20px;
            background: var(--bleu);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .btn-send:hover { background: #152b50; }
        .btn-send:disabled { background: #999; cursor: not-allowed; }
        .send-status { font-size: 0.85em; color: #666; font-style: italic; }
        .theme-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--gris);
            border-radius: 12px;
            justify-content: center;
        }
        .theme-btn {
            padding: 10px 14px;
            background: white;
            border: 2px solid var(--bordure);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .theme-btn:hover { background: var(--bleu-clair); color: white; border-color: var(--bleu-clair); }
        .theme-btn.active { background: var(--bleu); color: white; border-color: var(--bleu); }
        .progress-wrap { margin-bottom: 20px; }
        .progress {
            background: #e9ecef;
            border-radius: 15px;
            height: 25px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--vert), #20c997);
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.85em;
            min-width: 40px;
        }
        .theme-section { display: none; }
        .theme-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        .theme-title {
            font-size: 1.6em;
            color: var(--bleu);
            margin-bottom: 20px;
            padding: 10px 15px;
            border-left: 6px solid var(--bleu-clair);
            background: #f0f4ff;
            border-radius: 0 10px 10px 0;
        }
        .item-block {
            background: var(--blanc);
            border: 1px solid var(--bordure);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .item-block:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 15px 18px;
            background: var(--gris);
            cursor: pointer;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--bordure);
        }
        .item-header .item-num {
            background: var(--bleu);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85em;
            flex-shrink: 0;
        }
        .item-header .question-text { flex: 1; font-weight: 600; font-size: 0.95em; min-width: 200px; }
        .item-header .auto-eval-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-auto {
            padding: 7px 16px;
            border: 2px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            background: white;
            transition: all 0.2s;
        }
        .btn-auto.yes { border-color: var(--vert); color: var(--vert); }
        .btn-auto.yes.selected { background: var(--vert); color: white; }
        .btn-auto.no { border-color: var(--rouge); color: var(--rouge); }
        .btn-auto.no.selected { background: var(--rouge); color: white; }
        .btn-auto.maybe { border-color: var(--orange); color: var(--orange); }
        .btn-auto.maybe.selected { background: var(--orange); color: white; }
        .item-content { display: none; padding: 15px 18px; background: #fafbfc; }
        .item-content.open { display: block; animation: slideDown 0.3s; }
        @keyframes slideDown { from{opacity:0;max-height:0} to{opacity:1;max-height:2000px} }
        .questions-list { display: flex; flex-direction: column; gap: 12px; }
        .question-card {
            background: white;
            border: 1px solid var(--bordure);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid var(--bleu-clair);
        }
        .question-card .q-label {
            font-weight: bold;
            color: var(--bleu);
            margin-bottom: 8px;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .question-card .q-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .question-card input[type="text"] {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95em;
        }
        .question-card input[type="text"]:focus { outline: none; border-color: var(--bleu-clair); }
        .btn-small {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-verify { background: var(--bleu-clair); color: white; }
        .btn-verify:hover { background: #5a67d8; }
        .btn-correction { background: var(--jaune); color: #333; }
        .btn-correction:hover { background: #e0a800; }
        .btn-methode {
            background: #e8f0fe;
            color: var(--bleu);
            border: 2px solid var(--bleu-clair);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            padding: 10px 16px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-methode:hover { background: #d0e0fa; }
        .q-feedback {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            display: none;
        }
        .q-feedback.show { display: block; }
        .q-feedback.ok { background: #d4edda; color: #155724; }
        .q-feedback.ko { background: #f8d7da; color: #721c24; }
        .methode-camera {
            background: linear-gradient(135deg, #fff8e1, #fff3cd);
            border: 2px solid var(--jaune);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }
        .methode-camera.show { display: block; animation: slideDown 0.3s; }
        .methode-camera .camera-title {
            font-weight: bold;
            color: #856404;
            font-size: 1em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .methode-camera .camera-title .icon { font-size: 1.5em; }
        .methode-camera .camera-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
        }
        .camera-step {
            background: white;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid #e0d5a0;
            font-size: 0.85em;
        }
        .camera-step .step-num {
            background: var(--orange);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8em;
            margin: 0 auto 6px;
        }
        .camera-step .step-icon { font-size: 1.8em; display: block; margin-bottom: 4px; }
        .camera-step .step-text { font-weight: 500; }
        .exemple-concret {
            margin-top: 12px;
            background: #e8f5e9;
            border: 2px solid var(--vert);
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 0.85em;
            line-height: 1.5;
        }
        .exemple-concret .exemple-title {
            font-weight: bold;
            color: #155724;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .exemple-concret .exemple-step {
            padding: 4px 0;
            padding-left: 15px;
            border-left: 3px solid var(--vert);
            margin: 4px 0;
        }
        .exemple-concret .exemple-result {
            margin-top: 6px;
            padding: 6px 10px;
            background: white;
            border-radius: 6px;
            font-weight: bold;
            color: var(--bleu);
            text-align: center;
        }
        .summary-section {
            margin-top: 25px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 15px;
            border: 2px solid var(--bleu-clair);
        }
        .summary-section h3 { color: var(--bleu); text-align: center; margin-bottom: 15px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
        .summary-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid var(--bordure);
            font-size: 0.85em;
        }
        .summary-card .s-theme { font-weight: bold; color: var(--bleu); margin-bottom: 6px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin: 1px;
        }
        .badge.ok { background: #d4edda; color: #155724; }
        .badge.ko { background: #f8d7da; color: #721c24; }
        .badge.wait { background: #e0e0e0; color: #555; }
        .badge.full { background: #155724; color: white; }
        .btn-reset {
            display: block;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: var(--rouge);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }
        .btn-reset:hover { background: #b02a37; }
        .saved-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--vert);
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .comment-zone {
            margin-top: 10px;
            display: none;
        }
        .comment-zone.show { display: block; }
        .comment-zone textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9em;
            resize: vertical;
            min-height: 60px;
        }
        .comment-zone textarea:focus { outline: none; border-color: var(--bleu-clair); }
        @media (max-width: 700px) {
            .item-header { flex-direction: column; align-items: flex-start; }
            .camera-steps { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📐 Vade-Mecum Maths DNB</h1>
            <p class="subtitle">Auto-évaluation • Aide méthode • Questions de vérification</p>
        </header>
        <div class="code-section" id="codeSection">
            <h3>Entre ton prénom pour commencer</h3>
            <div class="code-input-group">
                <input type="text" id="codeInput" placeholder="Ton prénom" autocomplete="off" autofocus>
                <button class="btn-access" onclick="checkCode()">✅ Accéder</button>
            </div>
            <p class="error-message" id="errorMessage">❌ Prénom non reconnu. Vérifie l'orthographe.</p>
        </div>
        <div class="content" id="mainContent">
            <div class="user-bar">
                <span class="user-name">👤 <span id="displayName"></span></span>
                <span class="send-status"><span class="saved-indicator"></span> Progression sauvegardée</span>
                <button class="btn-send" id="btnSend" onclick="toggleComment()">📤 Envoyer mes résultats</button>
            </div>
            <div class="comment-zone" id="commentZone">
                <p style="margin-bottom:6px;font-weight:bold;color:var(--bleu)">💬 Un commentaire ? (facultatif)</p>
                <textarea id="commentText" placeholder="Ex : J'ai du mal avec les fractions..."></textarea>
                <button class="btn-small btn-verify" onclick="sendToSheets()" style="margin-top:8px;">✅ Confirmer l'envoi</button>
                <button class="btn-small" onclick="toggleComment()" style="margin-top:8px;background:#999;color:white;">Annuler</button>
            </div>
            <div class="theme-nav" id="themeNav"></div>
            <div class="progress-wrap"><div class="progress"><div class="progress-bar" id="progressBar" style="width:0%">0%</div></div></div>
            <div id="themesContainer"></div>
            <div class="summary-section">
                <h3>📊 Tableau de bord</h3>
                <div class="summary-grid" id="summaryGrid"></div>
                <button class="btn-reset" onclick="resetAll()">🔄 Tout réinitialiser</button>
            </div>
        </div>
    </div>

<script>
// ==================== CONFIG ====================
const VALID_PRENOMS = ["chantelle","pascale","zayd","nadim","halla","khadija","ahmed","anas","omar","fatimah","mira","jamila","nelley","abdelrahman","joudi","magdi","malak","dima","mohamed"];
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzuu7n2nObdW9keVoOxJ0POWRim85M1spBMgLu4a7Oups6nbFiv4pHDFY_L34snHqTDow/exec";

// ==================== DONNÉES CORRIGÉES ====================
const themes=[{id:1,title:"Thème 1 – Arithmétique et Nombres",items:[{label:"Utiliser les critères de divisibilité",methode:{title:"📷 Méthode caméra : Tester la divisibilité",icon:"📷",steps:[{icon:"1️⃣",text:"Identifier le nombre à tester"},{icon:"2️⃣",text:"Appliquer les règles de divisibilité"},{icon:"3️⃣",text:"Conclure si divisible ou non"}],exemple:{titre:"Exemple : 24 divisible par 3 ?",etapes:["24 = 2+4 = 6","6 est divisible par 3","Donc 24 est divisible par 3"],resultat:"✅ 24 ÷ 3 = 8"}},questions:[{q:"156 est-il divisible par 2?",r:"Oui"},{q:"257 est-il divisible par 5?",r:"Non"}]},{label:"Décomposer en facteurs premiers",methode:{title:"📷 Méthode caméra : Décomposition",icon:"🔢",steps:[{icon:"1️⃣",text:"Diviser par 2 tant que possible"},{icon:"2️⃣",text:"Passer au nombre premier suivant"},{icon:"3️⃣",text:"Continuer jusqu'à 1"}],exemple:{titre:"Exemple : Décomposer 12",etapes:["12 ÷ 2 = 6","6 ÷ 2 = 3","3 ÷ 3 = 1"],resultat:"✅ 12 = 2² × 3"}},questions:[{q:"Décompose 20",r:"2² × 5"},{q:"Décompose 15",r:"3 × 5"}]}]},{id:2,title:"Thème 2 – Fractions",items:[{label:"Simplifier une fraction",methode:{title:"📷 Méthode caméra : Simplification",icon:"🔄",steps:[{icon:"1️⃣",text:"Trouver le PGCD"},{icon:"2️⃣",text:"Diviser numérateur et dénominateur"},{icon:"3️⃣",text:"Vérifier si on peut continuer"}],exemple:{titre:"Exemple : Simplifier 12/18",etapes:["PGCD(12,18) = 6","12÷6 = 2, 18÷6 = 3","2/3 ne peut plus être simplifiée"],resultat:"✅ 12/18 = 2/3"}},questions:[{q:"Simplifie 8/12",r:"2/3"},{q:"Simplifie 15/25",r:"3/5"}]},{label:"Additionner des fractions",methode:{title:"📷 Méthode caméra : Addition",icon:"➕",steps:[{icon:"1️⃣",text:"Trouver un dénominateur commun"},{icon:"2️⃣",text:"Multiplier les numérateurs"},{icon:"3️⃣",text:"Additionner les numérateurs"}],exemple:{titre:"Exemple : 1/2 + 1/3",etapes:["Dénominateur commun : 6","1/2 = 3/6, 1/3 = 2/6","3/6 + 2/6 = 5/6"],resultat:"✅ 1/2 + 1/3 = 5/6"}},questions:[{q:"Calcule 1/4 + 1/4",r:"1/2"},{q:"Calcule 1/3 + 1/6",r:"1/2"}]}]},{id:3,title:"Thème 3 – Géométrie",items:[{label:"Calculer l'aire d'un rectangle",methode:{title:"📷 Méthode caméra : Aire Rectangle",icon:"📐",steps:[{icon:"1️⃣",text:"Identifier longueur et largeur"},{icon:"2️⃣",text:"Formule : A = L × l"},{icon:"3️⃣",text:"Multiplier et donner l'unité"}],exemple:{titre:"Exemple : Rectangle 5m × 3m",etapes:["Longueur = 5m, Largeur = 3m","A = 5 × 3","A = 15 m²"],resultat:"✅ Aire = 15 m²"}},questions:[{q:"Aire d'un rectangle 6cm × 4cm",r:"24 cm²"},{q:"Aire d'un rectangle 10m × 2m",r:"20 m²"}]},{label:"Calculer l'aire d'un triangle",methode:{title:"📷 Méthode caméra : Aire Triangle",icon:"△",steps:[{icon:"1️⃣",text:"Identifier base et hauteur"},{icon:"2️⃣",text:"Formule : A = (b × h) / 2"},{icon:"3️⃣",text:"Calculer et simplifier"}],exemple:{titre:"Exemple : Triangle base 6cm, hauteur 4cm",etapes:["b = 6cm, h = 4cm","A = (6 × 4) / 2 = 24/2","A = 12 cm²"],resultat:"✅ Aire = 12 cm²"}},questions:[{q:"Aire d'un triangle base 8cm, hauteur 5cm",r:"20 cm²"},{q:"Aire d'un triangle base 10m, hauteur 4m",r:"20 m²"}]}]},{id:4,title:"Thème 4 – Proportionnalité",items:[{label:"Reconnaître une proportionnalité",methode:{title:"📷 Méthode caméra : Proportionnalité",icon:"⚖️",steps:[{icon:"1️⃣",text:"Calculer les rapports"},{icon:"2️⃣",text:"Vérifier s'ils sont égaux"},{icon:"3️⃣",text:"Conclure"}],exemple:{titre:"Exemple : 2/4 = 3/6 ?",etapes:["2/4 = 0.5","3/6 = 0.5","Les rapports sont égaux"],resultat:"✅ C'est proportionnel"}},questions:[{q:"2/3 est-il égal à 4/6?",r:"Oui"},{q:"3/5 est-il égal à 6/9?",r:"Non"}]},{label:"Calculer avec la proportionnalité",methode:{title:"📷 Méthode caméra : Calcul",icon:"🔢",steps:[{icon:"1️⃣",text:"Écrire la proportion"},{icon:"2️⃣",text:"Utiliser le produit en croix"},{icon:"3️⃣",text:"Calculer l'inconnue"}],exemple:{titre:"Exemple : 3/4 = x/8",etapes:["x = (3 × 8) / 4","x = 24 / 4","x = 6"],resultat:"✅ x = 6"}},questions:[{q:"2/3 = 4/x, trouve x",r:"6"},{q:"5/2 = x/10, trouve x",r:"25"}]}]},{id:5,title:"Th // ==================== ÉTAT ====================
let currentUser = null;
let userAutoEval = {};
let userQuizResults = {};

function checkCode() {
    const input = document.getElementById('codeInput').value.trim().toLowerCase();
    if (VALID_PRENOMS.includes(input)) {
        currentUser = input;
        document.getElementById('codeSection').style.display = 'none';
        document.getElementById('mainContent').classList.add('active');
        document.getElementById('displayName').textContent = input.charAt(0).toUpperCase() + input.slice(1);
        initApp();
    } else {
        document.getElementById('errorMessage').style.display = 'block';
        setTimeout(() => { document.getElementById('errorMessage').style.display = 'none'; }, 3000);
    }
}

function initApp() {
    const saved = localStorage.getItem('vadeMecum_' + currentUser);
    if (saved) {
        const data = JSON.parse(saved);
        userAutoEval = data.autoEval || {};
        userQuizResults = data.quizResults || {};
    }
    themes.forEach(theme => {
        if (!userAutoEval[theme.id]) userAutoEval[theme.id] = {};
        if (!userQuizResults[theme.id]) userQuizResults[theme.id] = {};
        theme.items.forEach((item, idx) => {
            if (userAutoEval[theme.id][idx] === undefined) userAutoEval[theme.id][idx] = null;
            if (!userQuizResults[theme.id][idx]) userQuizResults[theme.id][idx] = {};
            item.questions.forEach((q, qIdx) => {
                if (userQuizResults[theme.id][idx][qIdx] === undefined) userQuizResults[theme.id][idx][qIdx] = null;
            });
        });
    });
    buildUI();
    switchTheme(1);
    updateProgress();
    updateSavedState();
}

function buildUI() {
    const nav = document.getElementById('themeNav');
    nav.innerHTML = '';
    themes.forEach(theme => {
        const btn = document.createElement('button');
        btn.className = 'theme-btn';
        btn.textContent = `Thème ${theme.id}`;
        btn.onclick = () => switchTheme(theme.id);
        nav.appendChild(btn);
    });
    const container = document.getElementById('themesContainer');
    container.innerHTML = '';
    themes.forEach(theme => {
        const section = document.createElement('div');
        section.className = 'theme-section';
        section.id = `theme-${theme.id}`;
        let html = `<h2 class="theme-title">${theme.title}</h2>`;
        theme.items.forEach((item, idx) => {
            let exempleHTML = '';
            if (item.methode.exemple) {
                exempleHTML = `<div class="exemple-concret"><div class="exemple-title">💡 ${item.methode.exemple.titre}</div>${item.methode.exemple.etapes.map(e => `<div class="exemple-step">${e}</div>`).join('')}<div class="exemple-result">${item.methode.exemple.resultat}</div></div>`;
            }
            const autoVal = userAutoEval[theme.id] && userAutoEval[theme.id][idx] ? userAutoEval[theme.id][idx] : null;
            html += `<div class="item-block" id="item-${theme.id}-${idx}">
                <div class="item-header" onclick="toggleItem(${theme.id},${idx})">
                    <span class="item-num">${idx+1}</span>
                    <span class="question-text">📌 ${item.label}</span>
                    <div class="auto-eval-btns" onclick="event.stopPropagation()">
                        <button class="btn-auto yes ${autoVal==='yes'?'selected':''}" id="btnYes-${theme.id}-${idx}" onclick="setAutoEval(${theme.id},${idx},'yes')">✅ Oui</button>
                        <button class="btn-auto maybe ${autoVal==='maybe'?'selected':''}" id="btnMaybe-${theme.id}-${idx}" onclick="setAutoEval(${theme.id},${idx},'maybe')">🤔 Presque</button>
                        <button class="btn-auto no ${autoVal==='no'?'selected':''}" id="btnNo-${theme.id}-${idx}" onclick="setAutoEval(${theme.id},${idx},'no')">❌ Non</button>
                    </div>
                </div>
                <div class="item-content" id="content-${theme.id}-${idx}">
                    <button class="btn-methode" id="btnMethode-${theme.id}-${idx}" onclick="toggleMethode(${theme.id},${idx})">💡 Afficher l'aide méthode</button>
                    <div class="methode-camera" id="methode-${theme.id}-${idx}">
                        <div class="camera-title"><span class="icon">${item.methode.icon}</span>${item.methode.title}</div>
                        <div class="camera-steps">${item.methode.steps.map((s,si) => `<div class="camera-step"><div class="step-num">${si+1}</div><span class="step-icon">${s.icon}</span><span class="step-text">${s.text}</span></div>`).join('')}</div>
                        ${exempleHTML}
                    </div>
                    <div class="questions-list">${item.questions.map((q,qIdx)=>{
                        const savedVal = userQuizResults[theme.id]&&userQuizResults[theme.id][idx]&&userQuizResults[theme.id][idx][qIdx]!==null?userQuizResults[theme.id][idx][qIdx]:null;
                        let fbClass='',fbText='';
                        if(savedVal===true){fbClass='q-feedback show ok';fbText='✅ Bravo !';}
                        else if(savedVal===false){fbClass='q-feedback show ko';fbText='❌ À revoir';}
                        return `<div class="question-card"><div class="q-label">🧪 Question ${qIdx+1} : ${q.q}</div><div class="q-input-row"><input type="text" id="input-${theme.id}-${idx}-${qIdx}" placeholder="Ta réponse..."><button class="btn-small btn-verify" onclick="checkQuiz(${theme.id},${idx},${qIdx})">Vérifier</button><button class="btn-small btn-correction" onclick="showCorrection(${theme.id},${idx},${qIdx})">Indice</button></div><div class="q-feedback ${fbClass}">${fbText}</div></div>`;
                    }).join('')}</div>
                </div>
            </div>`;
        });
        section.innerHTML = html;
        container.appendChild(section);
    });
}

function switchTheme(themeId) {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.theme-btn').forEach(b => { if (b.textContent === `Thème ${themeId}`) b.classList.add('active'); });
    document.querySelectorAll('.theme-section').forEach(s => s.classList.remove('active'));
    const section = document.getElementById(`theme-${themeId}`);
    if (section) section.classList.add('active');
}
function toggleItem(themeId, idx) {
    const content = document.getElementById(`content-${themeId}-${idx}`);
    if (content) content.classList.toggle('open');
}
function toggleMethode(themeId, idx) {
    const methode = document.getElementById(`methode-${themeId}-${idx}`);
    const btn = document.getElementById(`btnMethode-${themeId}-${idx}`);
    if (methode.classList.contains('show')) { methode.classList.remove('show'); btn.textContent = "💡 Afficher l'aide méthode"; }
    else { methode.classList.add('show'); btn.textContent = '🙈 Cacher l\'aide méthode'; }
}
function setAutoEval(themeId, idx, value) {
    if (!userAutoEval[themeId]) userAutoEval[themeId] = {};
    userAutoEval[themeId][idx] = value;
    ['yes','maybe','no'].forEach(v => {
        const btn = document.getElementById(`btn${v.charAt(0).toUpperCase()+v.slice(1)}-${themeId}-${idx}`);
        if (btn) btn.classList.remove('selected');
    });
    const activeBtn = document.getElementById(`btn${value.charAt(0).toUpperCase()+value.slice(1)}-${themeId}-${idx}`);
    if (activeBtn) activeBtn.classList.add('selected');
    const content = document.getElementById(`content-${themeId}-${idx}`);
    if (content) content.classList.add('open');
    saveToLocalStorage();
    updateProgress();
}
function checkQuiz(themeId, idx, qIdx) {
    const theme = themes.find(t => t.id === themeId);
    if (!theme) return;
    const question = theme.items[idx].questions[qIdx];
    const input = document.getElementById(`input-${themeId}-${idx}-${qIdx}`);
    const feedback = document.getElementById(`feedback-${themeId}-${idx}-${qIdx}`);
    if (!input || !feedback) return;
    const userAnswer = input.value.trim();
    const correctAnswer = question.r;
    const clean = (str) => str.replace(/\s+/g, '').replace(/×/g, '*').replace(/x/gi, '*').toLowerCase();
    if (!userQuizResults[themeId]) userQuizResults[themeId] = {};
    if (!userQuizResults[themeId][idx]) userQuizResults[themeId][idx] = {};
    if (clean(userAnswer) === clean(correctAnswer) || userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
        feedback.className = 'q-feedback show ok';
        feedback.textContent = '✅ Bravo ! C\'est la bonne réponse.';
        userQuizResults[themeId][idx][qIdx] = true;
    } else {
        feedback.className = 'q-feedback show ko';
        feedback.textContent = '❌ Ce n\'est pas la bonne réponse.';
        userQuizResults[themeId][idx][qIdx] = false;
    }
    saveToLocalStorage();
    updateProgress();
}
function showCorrection(themeId, idx, qIdx) {
    const theme = themes.find(t => t.id === themeId);
    if (!theme) return;
    const question = theme.items[idx].questions[qIdx];
    const feedback = document.getElementById(`feedback-${themeId}-${idx}-${qIdx}`);
    if (!feedback) return;
    feedback.className = 'q-feedback show';
    feedback.style.background = '#fff3cd';
    feedback.style.color = '#856404';
    feedback.textContent = `💡 Réponse : ${question.r}`;
}
function saveToLocalStorage() {
    if (!currentUser) return;
    const data = { autoEval: userAutoEval, quizResults: userQuizResults, lastUpdate: new Date().toISOString() };
    localStorage.setItem('vadeMecum_' + currentUser, JSON.stringify(data));
    updateSavedState();
}
function updateSavedState() {
    const statusEl = document.querySelector('.send-status');
    const saved = localStorage.getItem('vadeMecum_' + currentUser);
    if (saved) {
        const data = JSON.parse(saved);
        const d = new Date(data.lastUpdate);
        statusEl.innerHTML = `<span class="saved-indicator"></span> Sauvegardé le ${d.toLocaleDateString()} à ${d.toLocaleTimeString()}`;
    }
}
function updateProgress() {
    let totalQ = 0, answeredQ = 0;
    themes.forEach(theme => {
        theme.items.forEach((item, idx) => {
            item.questions.forEach((q, qIdx) => {
                totalQ++;
                if (userQuizResults[theme.id] && userQuizResults[theme.id][idx] && userQuizResults[theme.id][idx][qIdx] !== null) answeredQ++;
            });
        });
    });
    const pct = totalQ > 0 ? Math.round((answeredQ / totalQ) * 100) : 0;
    const bar = document.getElementById('progressBar');
    if (bar) { bar.style.width = pct + '%'; bar.textContent = pct + '%'; }
    updateSummary();
}
function updateSummary() {
    const grid = document.getElementById('summaryGrid');
    if (!grid) return;
    let html = '';
    themes.forEach(theme => {
        let totalQ = 0, okQ = 0, koQ = 0;
        theme.items.forEach((item, idx) => {
            item.questions.forEach((q, qIdx) => {
                totalQ++;
                if (userQuizResults[theme.id] && userQuizResults[theme.id][idx] && userQuizResults[theme.id][idx][qIdx] === true) okQ++;
                if (userQuizResults[theme.id] && userQuizResults[theme.id][idx] && userQuizResults[theme.id][idx][qIdx] === false) koQ++;
            });
        });
        const waitQ = totalQ - okQ - koQ;
        let badges = '';
        if (okQ === totalQ && totalQ > 0) badges = '<span class="badge full">🏆 Tout maîtrisé</span>';
        else {
            if (okQ > 0) badges += `<span class="badge ok">✅ ${okQ} bonnes</span> `;
            if (koQ > 0) badges += `<span class="badge ko">❌ ${koQ} à revoir</span> `;
            if (waitQ > 0) badges += `<span class="badge wait">⬜ ${waitQ} en attente</span>`;
        }
        html += `<div class="summary-card"><div class="s-theme">${theme.title}</div>${badges}</div>`;
    });
    grid.innerHTML = html;
}
function toggleComment() {
    const zone = document.getElementById('commentZone');
    zone.classList.toggle('show');
}
function sendToSheets() {
    if (!currentUser) return;
    const btn = document.getElementById('btnSend');
    btn.disabled = true;
    const themeScores = {};
    let totalQ = 0, totalOK = 0;
    themes.forEach(theme => {
        let okQ = 0, koQ = 0;
        theme.items.forEach((item, idx) => {
            item.questions.forEach((q, qIdx) => {
                totalQ++;
                if (userQuizResults[theme.id] && userQuizResults[theme.id][idx] && userQuizResults[theme.id][idx][qIdx] === true) { okQ++; totalOK++; }
                if (userQuizResults[theme.id] && userQuizResults[theme.id][idx] && userQuizResults[theme.id][idx][qIdx] === false) koQ++;
            });
        });
        themeScores[theme.id] = { ok: okQ, ko: koQ };
    });
    let autoYes = 0, autoTotal = 0;
    themes.forEach(theme => {
        theme.items.forEach((item, idx) => {
            autoTotal++;
            if (userAutoEval[theme.id] && userAutoEval[theme.id][idx] === 'yes') autoYes++;
        });
    });
    const now = new Date();
    const dateStr = now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR');
    const commentaire = document.getElementById('commentText').value.trim();
    const data = {
        nom: currentUser,
        date: dateStr,
        autoEval: autoYes + '/' + autoTotal,
        theme1: (themeScores[1]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[1]||{ko:0}).ko + '✗',
        theme2: (themeScores[2]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[2]||{ko:0}).ko + '✗',
        theme3: (themeScores[3]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[3]||{ko:0}).ko + '✗',
        theme4: (themeScores[4]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[4]||{ko:0}).ko + '✗',
        theme5: (themeScores[5]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[5]||{ko:0}).ko + '✗',
        theme6: (themeScores[6]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[6]||{ko:0}).ko + '✗',
        theme7: (themeScores[7]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[7]||{ko:0}).ko + '✗',
        theme8: (themeScores[8]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[8]||{ko:0}).ko + '✗',
        theme9: (themeScores[9]||{ok:0,ko:0}).ok + '✓ ' + (themeScores[9]||{ko:0}).ko + '✗',
        scoreTotal: totalQ > 0 ? Math.round((totalOK / totalQ) * 100) + '%' : '0%',
        commentaire: commentaire
    };
    
    console.log('📤 Tentative d\'envoi à:', SHEET_URL);
    console.log('📊 Données à envoyer:', data);
    
    fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(() => {
        console.log('✅ Réponse reçue du serveur');
        btn.textContent = '✅ Envoyé !';
        btn.style.background = '#28a745';
        document.getElementById('commentZone').classList.remove('show');
        document.getElementById('commentText').value = '';
        setTimeout(() => { btn.textContent = '📤 Envoyer mes résultats'; btn.style.background = ''; btn.disabled = false; }, 3000);
    })
    .catch((error) => {
        console.error('❌ Erreur lors de l\'envoi:', error);
        btn.textContent = '❌ Erreur, réessaie';
        btn.style.background = '#dc3545';
        setTimeout(() => { btn.textContent = '📤 Envoyer mes résultats'; btn.style.background = ''; btn.disabled = false; }, 3000);
    });
}
function resetAll() {
    if (confirm('⚠️ Réinitialiser TOUTES tes réponses ? Irréversible.')) {
        if (currentUser) localStorage.removeItem('vadeMecum_' + currentUser);
        userAutoEval = {}; userQuizResults = {};
        themes.forEach(theme => {
            userAutoEval[theme.id] = {}; userQuizResults[theme.id] = {};
            theme.items.forEach((item, idx) => {
                userAutoEval[theme.id][idx] = null;
                userQuizResults[theme.id][idx] = {};
                item.questions.forEach((q, qIdx) => { userQuizResults[theme.id][idx][qIdx] = null; });
            });
        });
        buildUI(); switchTheme(1); updateProgress();
    }
}
document.getElementById('codeInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkCode(); });
</script>
